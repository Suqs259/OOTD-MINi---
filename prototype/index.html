<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#100e20">
  <title>OOTD MINi · 交互原型</title>
  <link rel="icon" href="assets/partly.png" type="image/png">
  <script src="assets/tailwind.js"></script>
  <script src="assets/lucide.js" defer></script>
  <script src="overview.js" defer></script>
  <link rel="stylesheet" href="ui.css">
</head>
<body class="gallery min-h-screen text-white antialiased">
  <header class="mx-auto flex max-w-[1920px] items-center justify-between gap-4 px-6 py-5 md:px-12">
    <div class="flex items-center gap-3">
      <span class="brand-icon"><i data-lucide="shirt"></i></span>
      <span class="text-base font-bold tracking-wide">OOTD <span class="text-violet-300">MINi</span></span>
    </div>
    <span class="hidden items-center gap-2 text-xs text-violet-200/75 sm:flex"><i data-lucide="smartphone" class="size-4"></i> iPhone 16 Pro Max · 440 × 956 pt</span>
  </header>
  <main class="mx-auto max-w-[1920px] px-6 pb-12 md:px-12">
    <section class="mb-7 mt-5 flex flex-wrap items-end justify-between gap-4 md:mb-8 md:mt-6">
      <div>
        <h1 class="gallery-title font-semibold tracking-tight">今天穿什么？<br class="sm:hidden"><span> 先看看天气。</span></h1>
        <p class="mt-3 text-sm text-violet-200/80 md:text-base">从天气预报到今日穿搭的微信小程序交互原型</p>
      </div>
      <p class="inline-flex items-center gap-2 text-xs text-violet-200/75"><i data-lucide="mouse-pointer-2" class="size-4"></i> 可在手机框内点击、滚动和切换</p>
    </section>
    <div class="gallery-grid">
      <section aria-labelledby="weather-label">
        <header class="frame-label"><span class="frame-icon"><i data-lucide="cloud-sun"></i></span><div><h2 id="weather-label">OOTD 首页</h2><p>今日天气 · 近 7 日 · 风格选择</p></div></header>
        <div class="device"><iframe src="weather.html?demo=1" title="OOTD 首页"></iframe></div>
      </section>
      <section aria-labelledby="result-label">
        <header class="frame-label"><span class="frame-icon"><i data-lucide="sparkles"></i></span><div><h2 id="result-label">穿搭推荐</h2><p>底部弹层 · 建议 · 图片轮播</p></div></header>
        <div class="device"><iframe src="ootd.html?demo=1" title="穿搭推荐弹层"></iframe></div>
      </section>
      <section aria-labelledby="setup-label">
        <header class="frame-label"><span class="frame-icon"><i data-lucide="clipboard-pen"></i></span><div><h2 id="setup-label">首次设置</h2><p>城市、性别与个人描述</p></div></header>
        <div class="device"><iframe src="onboarding.html" title="首次设置"></iframe></div>
      </section>
      <section aria-labelledby="profile-label">
        <header class="frame-label"><span class="frame-icon"><i data-lucide="circle-user-round"></i></span><div><h2 id="profile-label">我的</h2><p>查看和编辑个人资料</p></div></header>
        <div class="device"><iframe src="profile.html?demo=1" title="我的"></iframe></div>
      </section>
    </div>
  </main>
</body>
</html>
